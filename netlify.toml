# kmay89.com — static pages, no bundling. The one build command writes
# library/world/index.json from the files in that folder, so dropping a
# region file into the repo is all it takes to put it in the world.
[build]
  publish = "."
  command = "node library/tools/make-world-index.js"

# The one piece of server-side code on the site: the room mailbox, an
# ephemeral WebRTC-handshake pigeonhole that gives every game here the same
# four-letter join code (and the list of rooms waiting for someone). Served
# same-origin at /api/room. It stores nothing but handshakes, and every game
# keeps working with it unreachable — see netlify/functions/room.js.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Canonical host: send www to the apex domain
[[redirects]]
  from = "https://www.kmay89.com/*"
  to = "https://kmay89.com/:splat"
  status = 301
  force = true

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera=(self) so the solving room's cube scanner can see; frames never leave the device
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"

# The social preview image rarely changes; let it cache hard
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The reading room's preloaded world: raw region-file bytes that only
# change when the file is replaced wholesale, so let them cache
[[headers]]
  for = "/library/world/*.mca"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The chess room's service worker must never be cached long, or installed
# players would stop hearing about new versions
[[headers]]
  for = "/chess/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same for the sudoku room's
[[headers]]
  for = "/sudoku/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# And the reading room's
[[headers]]
  for = "/library/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
